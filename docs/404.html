<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>LMShirtShop</title>
<script>
// เปิดลิงก์ในร้านตรง ๆ ก่อนที่ตัวรัน PHP จะพร้อม : ส่งกลับไปหน้าแรกให้ติดตั้งแล้วค่อยเปิดหน้าที่ต้องการ
(function () {
  var p = location.pathname, i = p.indexOf('/shop/');
  if (i >= 0) {
    location.replace(p.slice(0, i + 1) + '?go=' + encodeURIComponent(p.slice(i + 1) + location.search));
  }
})();
</script>
</head>
